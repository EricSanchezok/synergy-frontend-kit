name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SII-Holos/synergy
          ref: dev
          path: .synergy-api

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Link Plugin API 4 from Synergy dev
        env:
          BUN_INSTALL: ${{ runner.temp }}/synergy-bun
        run: |
          bun install --frozen-lockfile --cwd .synergy-api
          bun pm pkg delete 'peerDependencies.@ericsanchezok/synergy-plugin' 'devDependencies.@ericsanchezok/synergy-plugin' 'devDependencies.@ericsanchezok/synergy-plugin-kit'
          bun install
          (cd .synergy-api/packages/sdk/js && bun link)
          (cd .synergy-api/packages/plugin && bun link)
          (cd .synergy-api/packages/plugin-kit && bun link)
          bun link @ericsanchezok/synergy-sdk @ericsanchezok/synergy-plugin @ericsanchezok/synergy-plugin-kit

      - name: Verify skill bundles
        run: bun run verify:skills

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Validate plugin
        run: bun run validate:plugin

      - name: Build plugin
        run: bun run build:plugin

      - name: Pack plugin
        run: bun run pack:plugin
